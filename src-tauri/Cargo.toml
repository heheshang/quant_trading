[package]
name = "quant-trading-system"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "quant-trading-system"

[[bin]]
name = "quant-trading-system"
path = "src/main.rs"

[[bin]]
name = "migrate-db"
path = "src/bin/migrate.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Workspace crates
quant-common = { path = "../crates/common" }
data-layer = { path = "../crates/data-layer" }
strategy-layer = { path = "../crates/strategy-layer" }
trading-layer = { path = "../crates/trading-layer" }
risk-layer = { path = "../crates/risk-layer" }
monitor-layer = { path = "../crates/monitor-layer" }
security = { path = "../crates/security" }
quant-services = { path = "../crates/services" }
quant-repository = { path = "../crates/repository" }
quant-clients = { path = "../crates/clients" }
exchange-binance = { path = "../crates/exchange-binance" }
data-puller = { path = "../crates/data-puller" }

# Tauri
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
dotenv = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true, features = ["maths"] }
rust_decimal_macros = { workspace = true, features = ["reexportable"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
