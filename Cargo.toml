[workspace]
members = [
    "src-tauri",
    "crates/data-layer",
    "crates/strategy-layer",
    "crates/trading-layer",
    "crates/risk-layer",
    "crates/monitor-layer",
    "crates/common",
    "crates/security",
    "crates/exchange-okx",
    "crates/domain",
    "crates/repository",
    "crates/clients",
    "crates/services",
    "crates/data-puller",
]
resolver = "2"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"
# 严格 lint 暂缓启用（需先清理测试代码中的 unwrap/expect/切片）：
# unwrap_used = "deny"
# expect_used = "deny"
# panic_in_result_fn = "deny"
# indexing_slicing = "deny"
# string_slice = "deny"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Quant Trading Team"]
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
# Tauri dependencies
tauri = { version = "2.0", features = ["devtools"] }
tauri-build = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

# Database dependencies
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "tls-rustls-ring", "postgres", "json", "chrono", "uuid", "migrate", "rust_decimal", "derive", "macros"] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.23"

# Async runtime
tokio-util = "0.7"
futures = "0.3"

# Data structures and utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
rust_decimal = { version = "1.33", features = ["serde-float"] }
rust_decimal_macros = { version = "1.39.0", features = ["reexportable"]}

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Serialization
bincode = "1.3"
csv = "1.3"
parquet = "50.0"

# Networking and HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tungstenite = "0.21"
tokio-tungstenite = "0.21"

# Cryptography and security
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
jsonwebtoken = "9.2"

# Configuration
config = "0.14"
dotenv = "0.15"

# Metrics and monitoring
prometheus = "0.13"
lazy_static = "1.4"

# Mathematical computations
ndarray = "0.15"
statrs = "0.16"
okx = "0.1.9"
