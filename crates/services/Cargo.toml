[package]
name = "quant-services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Services layer — business logic orchestration.
# Depends on domain, repository, clients, and engine crates.
[dependencies]
quant-domain = { path = "../domain" }
quant-common = { path = "../common" }
quant-repository = { path = "../repository" }
quant-clients = { path = "../clients" }
exchange-okx = { path = "../exchange-okx", features = ["test-utils"] }
strategy-engine = { package = "strategy-layer", path = "../strategy-layer" }
trading-engine = { package = "trading-layer", path = "../trading-layer" }
risk-engine = { package = "risk-layer", path = "../risk-layer" }
monitor-engine = { package = "monitor-layer", path = "../monitor-layer" }
security = { path = "../security" }
data-layer = { path = "../data-layer" }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true, features = ["maths"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

# Database (for query access in services)
sqlx = { workspace = true }
rust_decimal_macros = { workspace = true }
toml = "0.8"

[dev-dependencies]
okx = { workspace = true }
