[package]
name = "trading-layer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
quant-common = { path = "../common" }
data-layer = { path = "../data-layer" }
exchange-binance = { path = "../exchange-binance" }
monitor-engine = { package = "monitor-layer", path = "../monitor-layer" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
rust_decimal_macros = "1.36"
rust_decimal = { workspace = true, features = ["maths"] }
# Exchange-binance with test-utils so the Binance client mock is available in tests.
exchange-binance = { path = "../exchange-binance", features = ["test-utils"] }

[lints]
workspace = true
